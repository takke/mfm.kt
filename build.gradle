// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.11.2' apply false
    id 'com.android.library' version '8.11.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.0' apply false
    id 'org.jetbrains.kotlin.multiplatform' version '2.3.0' apply false
    id 'maven-publish'
}

allprojects {
    group = 'jp.takke.mfm_kt'
    version = '1.0.1'
}

subprojects {
    if (project.name != 'sample_activity') {
        apply plugin: 'maven-publish'

        afterEvaluate {
            publishing {
                publications {
                    maven(MavenPublication) {
                        afterEvaluate {
                            // KMPの場合はcomponents.kotlinが使用される
                            if (project.plugins.hasPlugin('org.jetbrains.kotlin.multiplatform')) {
                                from components.kotlin
                            } else {
                                from components.release
                            }
                        }
                        groupId = project.group
                        artifactId = project.name
                        version = project.version
                    }
                }

                // takke.github.io/maven (GitHub Pages の静的 Maven リポジトリ) への公開先
                // 手順:
                //   1. ../takke.github.io に git@github.com:takke/takke.github.io.git をクローンしておく
                //   2. ./gradlew :mfm_kt:publishAllPublicationsToGithubIoRepository
                //      (または ../publish_all_libs_to_github_io.sh)
                //   3. takke.github.io 側で maven/ を commit & push
                // 出力先は -PgithubIoMavenDir=/path/to/takke.github.io/maven で上書き可能
                // 注意: 公開済みバージョンは Gradle が永久キャッシュするため、再公開時は必ず version を上げること
                repositories {
                    maven {
                        name = 'githubIo'
                        def dir = project.findProperty('githubIoMavenDir') ?: "${rootDir}/../takke.github.io/maven"
                        url = file(dir).toURI()
                    }
                }
            }
        }
    }
}